name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Create a free unsigned development MSI artifact. It is not published as a GitHub release."
        required: false
        default: "true"
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────
  # Build Windows release bundles
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version metadata
        id: meta
        shell: pwsh
        run: |
          $conf = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $conf.version
          $tag = "v$version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

          # Validate tag matches tauri.conf.json version (on tag push)
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $pushTag = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($pushTag -ne $tag) {
              Write-Error "Tag mismatch: pushed '$pushTag' but tauri.conf.json has '$tag'"
              exit 1
            }
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        # Pinned to match rust-toolchain.toml — do not float @stable.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Pre-build secret artifact guard
        shell: pwsh
        run: npm run secret:artifacts

      - name: Build frontend
        run: npm run build

      - name: Frontend feature tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests
        working-directory: src-tauri
        run: cargo test --bin zen

      - name: Verify dev/release profile isolation
        shell: pwsh
        run: |
          $lib = Get-Content -Raw src-tauri/src/lib.rs
          if (-not ($lib -match 'cfg!\(debug_assertions\)')) {
            Write-Error "src-tauri/src/lib.rs must branch on cfg!(debug_assertions) for dev/release profile isolation"
            exit 1
          }
          if (-not ($lib -match '"novus-dev\.db"')) {
            Write-Error "Dev database path (novus-dev.db) not found"
            exit 1
          }
          if (-not ($lib -match '"lancedb-dev"')) {
            Write-Error "Dev LanceDB path (lancedb-dev) not found"
            exit 1
          }
          Write-Host "Profile isolation contract verified."

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

      - name: Bundle size budget
        shell: pwsh
        run: npm run perf:budget

      - name: Build Tauri bundle
        run: npx tauri build

      - name: Development build notice
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host "Development build: producing an unsigned MSI artifact for local testing."
          Write-Host "No code-signing certificate or GitHub release is used for manual workflow runs."

      - name: Require signing credentials for published releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Published releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD. Use workflow_dispatch dry_run until code signing is configured."
          }

      - name: Sign Windows installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "zen-release-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe is unavailable on this runner" }
          $installers = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Include "*.msi", "*.exe" -File
          if ($installers.Count -eq 0) { throw "No Windows installers were produced" }
          foreach ($installer in $installers) {
            & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.Name)" }
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") { throw "Signature validation failed for $($installer.Name): $($signature.Status)" }
          }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Post-build secret artifact guard
        shell: pwsh
        run: npm run secret:artifacts

      - name: Verify no DB files in bundle output
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release/bundle"
          if (Test-Path $bundlePath) {
            $dbFiles = Get-ChildItem -Path $bundlePath -Recurse -Include "*.db","*.sqlite","*.sqlite3","*.db-journal","*.sqlite-journal",".env","*.env.*" -File
            if ($dbFiles.Count -gt 0) {
              Write-Error "FATAL: Database or secret files found in bundle output:"
              $dbFiles | ForEach-Object { Write-Error " - $($_.FullName)" }
              exit 1
            }
            Write-Host "Bundle output is clean — no database or secret files found."
          }

      - name: Upload unsigned development MSI
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zen-windows-dev-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Upload signed release bundles
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zen-windows-bundles
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

      # Generate Tauri updater JSON for tauri-plugin-updater
      - name: Generate updater manifest (disabled until native updater is configured)
        if: ${{ false }}
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"

          # Find the NSIS installer
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $nsisSetup = Get-ChildItem -Path $nsisDir -Filter "*.exe" -File | Select-Object -First 1

          if ($null -eq $nsisSetup) {
            Write-Warning "No NSIS installer found — skipping updater manifest."
            exit 0
          }

          $setupName = $nsisSetup.Name

          # Find the signature file if it exists
          $sigFile = Join-Path $nsisDir "$($setupName).sig"
          $signature = ""
          if (Test-Path $sigFile) {
            $signature = Get-Content -Raw $sigFile
          }

          $updater = @{
            version = $version
            notes = "Release $tag"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/$repo/releases/download/$tag/$setupName"
              }
            }
          } | ConvertTo-Json -Depth 5

          $updater | Out-File -FilePath "latest.json" -Encoding utf8
          Write-Host "Generated latest.json for updater."

      - name: Upload updater manifest (disabled until native updater is configured)
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: latest.json
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────
  # Publish GitHub Release
  # ──────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows bundles
        uses: actions/download-artifact@v4
        with:
          name: zen-windows-bundles
          path: bundles

      - name: Download updater manifest
        if: ${{ false }}
        uses: actions/download-artifact@v4
        with:
          name: updater-manifest
          path: .
        continue-on-error: true

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          mkdir -p release-assets
          # Collect MSI installers
          find bundles/msi -name "*.msi" -exec cp {} release-assets/ \; 2>/dev/null || true
          find bundles/msi -name "*.msi.sig" -exec cp {} release-assets/ \; 2>/dev/null || true
          echo "Collected assets:"
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: Zen ${{ needs.build-windows.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.build-windows.outputs.tag, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

