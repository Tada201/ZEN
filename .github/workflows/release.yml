name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Pre-build secret artifact guard
        shell: pwsh
        run: npm run secret:artifacts

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundle
        run: npx tauri build

      - name: Verify bundle has no secret artifacts
        shell: pwsh
        run: npm run secret:artifacts

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: zen-windows-bundles
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
