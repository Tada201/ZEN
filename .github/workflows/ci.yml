name: CI

# Manual-only to conserve hosted-runner resources. Run from Actions when needed.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────
  # Frontend: typecheck, build, tests, bundle size budget
  # ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build & tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret artifact guard (pre-build)
        shell: pwsh
        run: npm run secret:artifacts

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Bundle size budget
        shell: pwsh
        run: npm run perf:budget

      - name: Frontend feature tests
        run: npm test

      - name: Secret artifact guard (post-build)
        shell: pwsh
        run: npm run secret:artifacts

  # ──────────────────────────────────────────────────────────────
  # Backend: check, clippy, test, quality gates
  # ──────────────────────────────────────────────────────────────
  backend:
    name: Backend gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust
        # Pinned to match rust-toolchain.toml — do not float @stable, a clippy
        # upgrade once turned new lints into hard -D warnings failures.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Secret artifact guard
        shell: pwsh
        run: npm run secret:artifacts

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch runtime binaries
        shell: pwsh
        run: npm run runtime:fetch -- -Clean

      # `cargo clippy --all-targets` already type-checks every target, so a
      # separate `cargo check` only re-compiles the same crates. Dropped.
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --bin zen

      - name: Backend policy tests
        shell: pwsh
        run: npm run test:backend -- -NoKillStaleBuilds

      - name: Install ripgrep
        run: choco install ripgrep -y

      - name: Quality gates
        shell: pwsh
        run: npm run quality:fast

  # ──────────────────────────────────────────────────────────────
  # Runtime binary manifest validation
  # ──────────────────────────────────────────────────────────────
  runtime-binaries:
    name: Runtime binary manifest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret artifact guard
        shell: pwsh
        run: npm run secret:artifacts

      - name: Fetch runtime binaries
        shell: pwsh
        run: npm run runtime:fetch -- -Clean

      - name: Check runtime binaries
        shell: pwsh
        run: npm run runtime:check

      - name: Verify fetched binaries have no secret artifacts
        shell: pwsh
        run: npm run secret:artifacts

  # ──────────────────────────────────────────────────────────────
  # Dependency audit (runs on ubuntu for speed)
  # ──────────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        working-directory: src-tauri
        run: cargo audit
