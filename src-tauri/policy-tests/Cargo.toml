[package]
name = "zen-policy-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# Phase 4: permission/secret/url policy moved into the zen-security crate;
# Phase 10: runtime_resource moved into the zen-media crate. These tests now
# exercise the crates directly instead of #[path]-mirroring app source files.
# The mcp trio stays mirrored until its logic settles.
zen-security = { workspace = true }
zen-mcp = { workspace = true }
zen-media = { workspace = true }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "process"] }
tracing = { workspace = true }
url = "2"
reqwest = { workspace = true, features = ["native-tls"] }
