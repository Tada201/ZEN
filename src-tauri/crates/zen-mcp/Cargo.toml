[package]
name = "zen-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "MCP client/config/consent/discovery for the Zen backend workspace (BIG_MIGRATION.md Phase 8)"

[dependencies]
zen-core = { workspace = true }
zen-security = { workspace = true }
zen-tools = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
# Same pin as the app crate: Windows Job Object sandboxing for stdio MCP
# child processes (relocated usage, not a new dependency).
windows-sys = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
jsonschema = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
