[package]
name = "zen-llm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "LLM provider clients and streaming for the Zen backend workspace (BIG_MIGRATION.md Phase 7)"

[dependencies]
zen-core = { workspace = true }
async-trait = { workspace = true }
# Same version pin as the app crate; relocated usage, not a new dependency.
base64 = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
lazy_static = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
