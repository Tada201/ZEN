[package]
name = "zen-security"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
zen-core = { workspace = true }
zen-db = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
# url_safety builds DNS-pinned no-redirect clients; native-tls keeps the
# pinned HTTPS behavior identical to the app build (feature-unified anyway).
reqwest = { workspace = true, features = ["native-tls", "json"] }
tokio = { workspace = true, features = ["sync", "net", "macros", "rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
