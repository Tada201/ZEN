[package]
name = "zen-media"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Speech (whisper) + TTS (piper) runtimes, hardware probing and subprocess lifecycle for the Zen backend workspace (BIG_MIGRATION.md Phase 10)"

[dependencies]
zen-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "sync", "time", "net"] }
tracing = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "json", "multipart"] }
# Native audio (same pins as the app crate; usage moved, not new deps —
# Security.md provenance unchanged).
rodio = "0.20"
hound = "3.5"
cpal = { workspace = true }
# System/GPU probing moved with hardware.rs.
sysinfo = { workspace = true }
# POSIX process signalling for whisper/piper cleanup on non-Windows. Already
# resolved transitively in the tree at this exact version (>30 days old per
# Security.md); pinned so no net-new supply-chain surface is introduced.
[target.'cfg(not(windows))'.dependencies]
nix = { version = "=0.28.0", features = ["signal", "process"] }

[dev-dependencies]
tempfile = { workspace = true }

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
