[package]
name = "zen-rag"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Vector stores, embeddings and document ingestion for the Zen backend workspace (BIG_MIGRATION.md Phase 9)"

[dependencies]
zen-core = { workspace = true }
# hybrid_backend persists session memories through zen-db's query layer
# (RULES.md rule 5: SQL only under zen-db queries).
zen-db = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time"] }
tracing = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "json"] }

# Pins hoisted to [workspace.dependencies] in Phase 13 (relocated usage,
# Security.md provenance unchanged).
lancedb = "0.26"
arrow-array = "57"
arrow-schema = "57"
candle-core = "0.9"
candle-transformers = "0.9"
candle-nn = "0.9"
tokenizers = "0.21"
text-splitter = { version = "0.16", features = ["tiktoken-rs"] }
tiktoken-rs = { workspace = true }
calamine = "=0.35.0"
quick-xml = "=0.41.0"
zip = { workspace = true }
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector" }
dirs = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
