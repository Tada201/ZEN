[package]
name = "zen-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Canonical tool architecture: Tool/AgentTool traits, registries, discovery manager, capability metadata (BIG_MIGRATION.md Phase 5)"

[dependencies]
zen-core = { workspace = true }
zen-security = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
