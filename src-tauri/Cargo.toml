[package]
name = "zen"
version = "0.1.0"
description = "Zen - Integrated OSINT & Agentic Workbench"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "multipart"] }
futures = "0.3"
async-trait = "0.1"
sysinfo = "0.33"
axum = { version = "0.8", features = ["default", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
anyhow = "1.0"
dirs = "6.0"
portable-pty = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
image = "0.25"
dashmap = "6.1"
lancedb = "0.26"
arrow-array = "57"
arrow-schema = "57"
lazy_static = "1.5"
tempfile = "3"
url = "2"
tiktoken-rs = "0.6"
tokio-stream = "0.1"
moka = { version = "0.12", features = ["future"] }
tokenizers = "0.21"
candle-core = "0.9"
candle-transformers = "0.9"
candle-nn = "0.9"
sgp4 = "0.2"
jsonschema = "0.42"
similar = "2.7"
hound = "3.5"
webrtc-vad = "0.4.0"
rodio = "0.20"
async-recursion = "1.1"
percent-encoding = "2.3"
urlencoding = "2.1"
scraper = "0.22.0"
spider = "2.2"
sha2 = "0.10"
text-splitter = { version = "0.16", features = ["tiktoken-rs"] }
ab_glyph = "0.2"
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector" }
meval = "0.2"
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
wiremock = "0.6"

[profile.dev]
opt-level = 0
incremental = false
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
