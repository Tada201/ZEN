[workspace]
# `crates/*` valid since Phase 2 (zen-core); globs matching no package dir
# are rejected by this Cargo version.
members = [".", "policy-tests", "crates/*"]
resolver = "2"

# Shared dependency versions (BIG_MIGRATION.md Phase 1). Member crates add
# their own feature sets on top via `{ workspace = true, features = [...] }`
# so per-crate feature choices stay explicit and no member silently inherits
# features it does not use.
[workspace.dependencies]
serde = "1"
serde_json = "1"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json"] }
reqwest = { version = "0.12", default-features = false }
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"

# ── Pins previously duplicated verbatim in two or more member manifests,
# hoisted in BIG_MIGRATION.md Phase 13 so versions skew nowhere and Security.md's
# 30-day rule is checked in one place. Members reference these via
# `{ workspace = true }`. ──────────────────────────────────────────────────────
async-recursion = "1.1"
base64 = "0.22"
cpal = "0.15"
dashmap = "6.1"
dirs = "6.0"
futures-util = "0.3"
jsonschema = "0.42"
lazy_static = "1.5"
meval = "0.2"
regex = "1"
sha2 = "0.10"
sysinfo = "0.38"
tempfile = "3"
tiktoken-rs = "0.6"
url = "2"
wiremock = "0.6"
zip = "4.6.1"
# Windows Job Object sandboxing for stdio MCP child processes (app + zen-mcp);
# already resolved transitively in the tree (>30 days old per Security.md).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
zen-core = { path = "crates/zen-core" }
zen-db = { path = "crates/zen-db" }
zen-security = { path = "crates/zen-security" }
zen-tools = { path = "crates/zen-tools" }
zen-llm = { path = "crates/zen-llm" }
zen-mcp = { path = "crates/zen-mcp" }
zen-rag = { path = "crates/zen-rag" }
zen-media = { path = "crates/zen-media" }
zen-agent = { path = "crates/zen-agent" }

# Shared package metadata (Phase 13): members inherit via
# `version.workspace = true` etc. instead of repeating the values.
[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Lint policy (BIG_MIGRATION.md Phase 13): enforced by every `cargo clippy`
# run via `[lints] workspace = true` in each member, not by whoever remembers
# the `-D warnings` flag. The deny set targets this codebase's known failure
# modes; test code is exempted from unwrap/expect via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Would have caught the Phase 9 session_memory RwLock deadlock class
# (Appendix F).
await_holding_lock = "deny"
redundant_clone = "deny"
needless_borrow = "deny"
uninlined_format_args = "deny"

[package]
name = "zen"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Zen - Integrated OSINT & Agentic Workbench"
authors = ["you"]

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Diagnostic-only (BIG_MIGRATION.md Phase 0, risk R5): appends
# {event, payload-shape} JSONL lines to $ZEN_EVENT_SNAPSHOT_PATH for
# event-contract diffing across migration phases. Never enabled in CI or
# release builds; compiles to an inlined no-op when off.
event-snapshot = ["zen-agent/event-snapshot"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "json", "stream", "multipart"] }
futures = { workspace = true }
async-trait = { workspace = true }
zen-core = { workspace = true }
zen-db = { workspace = true }
zen-security = { workspace = true }
zen-tools = { workspace = true }
zen-llm = { workspace = true }
zen-mcp = { workspace = true }
zen-rag = { workspace = true }
zen-media = { workspace = true }
zen-agent = { workspace = true }
sysinfo = { workspace = true }
axum = { version = "0.8", features = ["default", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
regex = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
portable-pty = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
lazy_static = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
tiktoken-rs = { workspace = true }
tokio-stream = "0.1"
moka = { version = "0.12", features = ["future"] }
sgp4 = "0.2"
jsonschema = { workspace = true }
similar = "2.7"
webrtc-vad = "0.4.0"
cpal = { workspace = true }
# Whisper (hound) and Piper (rodio) moved to the zen-media crate in
# Phase 10; the app reaches the media services via `zen_media::*`. `cpal`
# stays (commands/audio.rs device enumeration) and `webrtc-vad` stays
# (commands/voice.rs VAD gate).
async-recursion = { workspace = true }
percent-encoding = "2.3"
urlencoding = "2.1"
scraper = "0.22.0"
spider = "2.2"
sha2 = { workspace = true }
zip = { workspace = true }
# Magic-byte file-type sniffing for chat attachment validation. Pinned to the
# version already resolved transitively (see Cargo.lock) — no new provenance.
infer = "=0.19.0"
# Office extraction (calamine/quick-xml), chunking (text-splitter) and PDF
# text (pdf-inspector) moved to the zen-rag crate in Phase 9; the app crate
# reaches them through `zen_rag::{office_extract, ingestion}`.
ab_glyph = "0.2"
meval = { workspace = true }
keyring = { version = "3", features = ["windows-native"] }
geojson = "0.24"

[dev-dependencies]
wiremock = { workspace = true }

# Windows Job Object sandboxing for stdio MCP child processes. windows-sys 0.59
# is already resolved transitively in the tree (>30 days old per Security.md);
# these feature flags are additive and only enable the JobObjects/Threading FFI.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
# Embedded WebView2 preview: in-process COM + CDP (CallDevToolsProtocolMethod)
# and CapturePreview screenshot. Both crates already resolve transitively via
# wry 0.55.1 (>30 days old, same provenance); pinned to the exact lockfile
# versions so no net-new supply-chain surface is introduced.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }

[profile.dev]
opt-level = 0
incremental = false
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Inherit the workspace lint policy ([workspace.lints] at the root).
[lints]
workspace = true
