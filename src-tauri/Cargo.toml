[workspace]
# `crates/*` valid since Phase 2 (zen-core); globs matching no package dir
# are rejected by this Cargo version.
members = [".", "policy-tests", "crates/*"]
resolver = "2"

# Shared dependency versions (BIG_MIGRATION.md Phase 1). Member crates add
# their own feature sets on top via `{ workspace = true, features = [...] }`
# so per-crate feature choices stay explicit and no member silently inherits
# features it does not use.
[workspace.dependencies]
serde = "1"
serde_json = "1"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json"] }
reqwest = { version = "0.12", default-features = false }
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"
zen-core = { path = "crates/zen-core" }
zen-db = { path = "crates/zen-db" }
zen-security = { path = "crates/zen-security" }
zen-tools = { path = "crates/zen-tools" }
zen-llm = { path = "crates/zen-llm" }
zen-mcp = { path = "crates/zen-mcp" }

[package]
name = "zen"
version = "0.1.0"
description = "Zen - Integrated OSINT & Agentic Workbench"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Diagnostic-only (BIG_MIGRATION.md Phase 0, risk R5): appends
# {event, payload-shape} JSONL lines to $ZEN_EVENT_SNAPSHOT_PATH for
# event-contract diffing across migration phases. Never enabled in CI or
# release builds; compiles to an inlined no-op when off.
event-snapshot = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "json", "stream", "multipart"] }
futures = { workspace = true }
async-trait = { workspace = true }
zen-core = { workspace = true }
zen-db = { workspace = true }
zen-security = { workspace = true }
zen-tools = { workspace = true }
zen-llm = { workspace = true }
zen-mcp = { workspace = true }
sysinfo = "0.38"
axum = { version = "0.8", features = ["default", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
anyhow = { workspace = true }
dirs = "6.0"
portable-pty = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
image = "0.25"
dashmap = "6.1"
lancedb = "0.26"
arrow-array = "57"
arrow-schema = "57"
lazy_static = "1.5"
tempfile = "3"
url = "2"
tiktoken-rs = "0.6"
tokio-stream = "0.1"
moka = { version = "0.12", features = ["future"] }
tokenizers = "0.21"
candle-core = "0.9"
candle-transformers = "0.9"
candle-nn = "0.9"
sgp4 = "0.2"
jsonschema = "0.42"
similar = "2.7"
hound = "3.5"
webrtc-vad = "0.4.0"
rodio = "0.20"
cpal = "0.15"
async-recursion = "1.1"
percent-encoding = "2.3"
urlencoding = "2.1"
scraper = "0.22.0"
spider = "2.2"
sha2 = "0.10"
zip = "4.6.1"
# Magic-byte file-type sniffing for chat attachment validation. Pinned to the
# version already resolved transitively (see Cargo.lock) — no new provenance.
infer = "=0.19.0"
# Native (MSI-safe) office extraction, replacing the Python markitdown path.
# calamine: pure-Rust xlsx/xls/ods reader, 0.35.0 published 2026-05-10 (>30d).
# quick-xml pinned to the version already resolved transitively (Cargo.lock)
# — used to strip text from docx/pptx OOXML parts unzipped via `zip`.
calamine = "=0.35.0"
quick-xml = "=0.41.0"
text-splitter = { version = "0.16", features = ["tiktoken-rs"] }
ab_glyph = "0.2"
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector" }
meval = "0.2"
keyring = { version = "3", features = ["windows-native"] }
geojson = "0.24"

[dev-dependencies]
wiremock = "0.6"

# Windows Job Object sandboxing for stdio MCP child processes. windows-sys 0.59
# is already resolved transitively in the tree (>30 days old per Security.md);
# these feature flags are additive and only enable the JobObjects/Threading FFI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Embedded WebView2 preview: in-process COM + CDP (CallDevToolsProtocolMethod)
# and CapturePreview screenshot. Both crates already resolve transitively via
# wry 0.55.1 (>30 days old, same provenance); pinned to the exact lockfile
# versions so no net-new supply-chain surface is introduced.
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }

[profile.dev]
opt-level = 0
incremental = false
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
