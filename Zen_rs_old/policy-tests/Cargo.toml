[package]
name = "zen-policy-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "process"] }
tracing = "0.1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
