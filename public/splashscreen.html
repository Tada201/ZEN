<!DOCTYPE html>
<html lang="en" style="background:#08080c">
  <head>
    <meta charset="UTF-8" />
    <title>Zen Startup</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #08080c;
        overflow: hidden;
        font-family: ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        user-select: none;
        color: #d4d4d8;
      }
      .splash-container {
        width: 100vw;
        height: 100vh;
        background: #08080c;
        border: 2px solid #4a8a9a;
        border-radius: 8px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        padding: 40px;
      }
      .bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.55; /* Significantly brighter video background visibility */
        z-index: 1;
        pointer-events: none;
      }
      
      /* Panels shared layout based on eDEX-UI frame concept */
      .panel {
        position: relative;
        z-index: 2;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(74, 138, 154, 0.35);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
      }
      .panel-header {
        padding: 8px 12px;
        border-bottom: 1px solid rgba(74, 138, 154, 0.2);
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #a1a1aa;
        background: rgba(74, 138, 154, 0.05);
        display: flex;
        justify-content: space-between;
      }
      .panel-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        font-size: 10px;
        line-height: 1.5;
        scrollbar-width: none; /* Firefox */
      }
      .panel-content::-webkit-scrollbar {
        display: none; /* Safari and Chrome */
      }

      /* Left Status Panel */
      .status-panel {
        position: absolute;
        left: 40px;
        top: 40px;
        bottom: 40px;
        width: 240px;
        background: transparent;
        border: none;
      }
      .status-panel .panel-header {
        background: transparent;
        border-bottom: none;
        color: transparent;
        visibility: hidden;
      }
      .status-item {
        display: flex;
        margin-bottom: 6px;
        align-items: center;
      }
      .status-indicator {
        width: 40px;
        font-weight: bold;
        margin-right: 8px;
        text-align: right;
      }
      .status-ok { color: #10b981; }
      .status-run { color: #fbbf24; }
      .status-err { color: #ef4444; }
      .status-pend { color: #52525b; }

      /* Middle Logo & Progress Panel */
      .logo-panel {
        width: 320px;
        justify-content: center;
        align-items: center;
        border: none;
        background: transparent;
      }
      .logo-frame {
        padding: 1.2rem 2.8rem;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid #4a8a9a;
        margin-bottom: 1.5rem;
      }
      .logo-text {
        font-size: 2.8rem;
        font-weight: 300;
        color: #4a8a9a;
        letter-spacing: 0.6em;
        margin-left: 0.6em;
        text-transform: uppercase;
        position: relative;
        display: inline-block;
      }
      .logo-text::before, .logo-text::after {
        content: "ZEN";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: #4a8a9a;
        clip-path: polygon(100% 0%, 100% 43%, 0% 43%, 0% 0%);
        animation: glitch-anim-1 2.2s infinite linear alternate-reverse;
      }
      .logo-text::after {
        clip-path: polygon(100% 43%, 100% 100%, 0% 100%, 0% 43%);
        animation: glitch-anim-2 2.2s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim-1 {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 0); }
        40% { transform: translate(-2px, 0); }
        60% { transform: translate(2px, 0); }
        80% { transform: translate(2px, 0); }
      }
      @keyframes glitch-anim-2 {
        0%, 100% { transform: translate(0); }
        15% { transform: translate(2px, 0); }
        35% { transform: translate(2px, 0); }
        55% { transform: translate(-2px, 0); }
        75% { transform: translate(-2px, 0); }
      }
      
      .bar-frame {
        width: 240px;
        height: 6px;
        border: 1px solid rgba(74, 138, 154, 0.4);
        background: rgba(0, 0, 0, 0.6);
        padding: 1px;
        box-sizing: border-box;
        border-radius: 2px;
        position: relative;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: #4a8a9a;
        border-radius: 1px;
        transition: width 0.15s ease-out;
      }
      .progress-meta {
        margin-top: 8px;
        display: flex;
        width: 240px;
        justify-content: space-between;
        font-size: 9px;
        color: #71717a;
      }

      /* Right Log Panel */
      .log-panel {
        width: 240px;
      }
      .log-entry {
        display: flex;
        margin-bottom: 4px;
        word-break: break-all;
        font-family: monospace;
      }
      .log-time {
        color: #52525b;
        margin-right: 6px;
        flex-shrink: 0;
      }
      .log-msg {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <video class="bg-video" autoPlay muted loop playsInline>
        <source src="video/boot.mp4" type="video/mp4" />
      </video>

      <!-- Left Panel: Status -->
      <div class="panel status-panel">
        <div class="panel-header">
          <span></span>
          <span></span>
        </div>
        <div class="panel-content" id="status-container">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Middle Panel: Branding and Progress -->
      <div class="panel logo-panel">
        <div class="logo-frame">
          <div class="logo-text">Zen</div>
        </div>
        <div class="bar-frame">
          <div class="progress-fill" id="progress-bar"></div>
        </div>
        <div class="progress-meta">
          <span id="init-phase-label">BIOS Loading</span>
          <span id="progress-percent">0%</span>
        </div>
      </div>
    </div>

    <script src="splashscreen.js"></script>
  </body>
</html>
